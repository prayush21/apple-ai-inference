[project]
name = "apple-ai-inference"
version = "0.1.0"
description = "Core AI experiments: the WWDC26 snake demo and a SmolLM2 token-streaming port"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.8,<2.13",
    "coreai-torch>=0.4.2",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
# Hugging Face stack for llm_ai only; snake_ai does not need it.
llm = ["huggingface_hub>=0.30", "safetensors>=0.4", "tokenizers>=0.20"]

[project.scripts]
snake-train = "snake_ai.train:main"
snake-convert = "snake_ai.convert:main"
snake-verify = "snake_ai.verify:main"
snake-play = "snake_ai.play:main"
llm-download = "llm_ai.download:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["snake_ai*", "llm_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
