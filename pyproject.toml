[project]
name = "apple-ai-inference"
version = "0.1.0"
description = "Core AI experiments: the WWDC26 snake demo and a zero-shot NLI decision model"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.8,<2.13",
    "coreai-torch>=0.4.2",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
# Hugging Face stack for decide_ai. transformers is only used to load the
# reference model in tests/verify; serve.py never imports it.
decide = ["huggingface_hub>=0.30", "safetensors>=0.4", "tokenizers>=0.20", "transformers>=4.40"]

[project.scripts]
snake-train = "snake_ai.train:main"
snake-convert = "snake_ai.convert:main"
snake-verify = "snake_ai.verify:main"
snake-play = "snake_ai.play:main"
decide-download = "decide_ai.download:main"
decide-convert = "decide_ai.convert:main"
decide-verify = "decide_ai.verify:main"
decide-calibrate = "decide_ai.calibrate:main"
decide-serve = "decide_ai.serve:main"
decide-bench = "decide_ai.bench:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["snake_ai*", "decide_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
